<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="facet-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="facet-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" />

  <!-- Ambient Glow Behind Die -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" fill-opacity="0.18" filter="url(#glow)" />

  <!-- D20 Polyhedral Die Facets -->
  <g transform="translate(256, 256) scale(1.15) translate(-256, -256)" stroke="#090d16" stroke-width="4" stroke-linejoin="round">
    <!-- Top Central Triangle -->
    <polygon points="256,110 376,190 136,190" fill="url(#facet-grad-2)" fill-opacity="0.95" />
    
    <!-- Upper Left Triangle -->
    <polygon points="256,110 136,190 106,280" fill="url(#facet-grad-1)" fill-opacity="0.85" />
    
    <!-- Upper Right Triangle -->
    <polygon points="256,110 376,190 406,280" fill="url(#facet-grad-1)" fill-opacity="0.75" />

    <!-- Center Inverted Triangle -->
    <polygon points="136,190 376,190 256,360" fill="#1e1b4b" fill-opacity="0.95" />

    <!-- Center Left Triangle -->
    <polygon points="136,190 106,280 186,375" fill="url(#facet-grad-1)" fill-opacity="0.9" />

    <!-- Center Right Triangle -->
    <polygon points="376,190 406,280 326,375" fill="url(#facet-grad-2)" fill-opacity="0.8" />

    <!-- Lower Triangle Under Center -->
    <polygon points="186,375 256,360 256,410" fill="url(#facet-grad-1)" fill-opacity="0.7" />
    <polygon points="326,375 256,360 256,410" fill="url(#facet-grad-2)" fill-opacity="0.85" />

    <!-- 20 Inscription in Center Triangle -->
    <text x="256" y="295" font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="-1">20</text>
  </g>

  <!-- Small Corner Accent Glyphs -->
  <circle cx="256" cy="74" r="5" fill="#818cf8" />
  <circle cx="256" cy="438" r="5" fill="#818cf8" opacity="0.6" />
</svg>
