<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Stream Relay</title></head>
<body>
<script>
(function () {
  if (typeof BroadcastChannel === "undefined") return;
  const bc = new BroadcastChannel("owlbear_stream_remote_control");

  // Forward inputs from Character Sheet BroadcastChannel -> parent Owlbear Rodeo tab
  bc.onmessage = (ev) => {
    if (ev.data && ev.data.type === "OBR_REMOTE_INPUT") {
      try {
        window.parent.postMessage(ev.data, "*");
      } catch (e) {}
    }
  };

  // Forward ready/status acks from parent Owlbear Rodeo tab -> Character Sheet BroadcastChannel
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "OBR_STREAM_BRIDGE_READY") {
      try {
        bc.postMessage(ev.data);
      } catch (e) {}
    }
  });

  try {
    bc.postMessage({ type: "OBR_STREAM_BRIDGE_READY", via: "relay-iframe", timestamp: Date.now() });
  } catch (e) {}
})();
</script>
</body>
</html>
